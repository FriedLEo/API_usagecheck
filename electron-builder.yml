appId: com.deepseekusagetracker.windows
productName: DeepSeek Usage Tracker
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: DeepSeek-Usage-Tracker-${version}-${arch}.${ext}
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Usage Tracker
