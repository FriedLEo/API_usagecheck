appId: com.apitrackdesktop.windows
productName: API track desktop
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: API-track-desktop-${version}-${arch}.${ext}
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: API track desktop
